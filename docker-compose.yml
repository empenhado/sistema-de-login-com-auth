services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: authsystem_user
      POSTGRES_PASSWORD: 123
      POSTGRES_DB: authsystem
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U authsystem_user -d authsystem"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata: